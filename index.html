<style>
/* düzen: tasarım programı — solda sayfalar ve katmanlar, ortada tuval, sağda seçili öğenin özellikleri */
:root{
  --canvas:#EBEBEA; --panel:#FFFFFF; --line:#E3E3E1; --ink:#161616; --mute:#6B6B68; --lab:#8A8A88;
  --on:#F1F1EF; --sel:#0D99FF; --selbg:#E5F1FD; --red:#C8142B; --paper:#FFFFFF; --chip:#F1F1EF;
  --f:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --tw:52px; --pw:240px; --iw:272px; --bar:44px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --canvas:#1E1E1E; --panel:#2C2C2C; --line:#3A3A3A; --ink:#F2F2F2; --mute:#A3A39F; --lab:#8E8E8A;
  --on:#383838; --selbg:#0D99FF33; --chip:#EEEEEC; color-scheme:dark}}
:root[data-theme="dark"]{--canvas:#1E1E1E; --panel:#2C2C2C; --line:#3A3A3A; --ink:#F2F2F2; --mute:#A3A39F; --lab:#8E8E8A;
  --on:#383838; --selbg:#0D99FF33; --chip:#EEEEEC; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--canvas);color:var(--ink);font-family:var(--f);font-size:14px;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit}
.app{height:100%;display:grid;grid-template-rows:var(--bar) 1fr;grid-template-columns:var(--iw) 1fr var(--pw)}
.right{grid-column:1;grid-row:2}.canvas{grid-column:2;grid-row:2}.left{grid-column:3;grid-row:2}
body.insp-off .app{grid-template-columns:0 1fr var(--pw)}body.insp-off .right{display:none}
.tools #t-insp[aria-pressed="true"],.tools #t-ol[aria-pressed="true"]{background:var(--selbg);color:var(--sel)}
.rhd{display:flex;align-items:center;justify-content:space-between;padding-right:10px}
.ix{display:grid;place-items:center;width:26px;height:26px;border:0;border-radius:6px;background:none;cursor:pointer;color:var(--mute);margin-top:8px}.ix:hover{background:var(--on);color:var(--ink)}
/* araç kutusu: soldaki dikey ikon şeridi */
.tbx{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;min-height:0}
.tbx button{display:grid;place-items:center;width:34px;height:34px;padding:0;border:0;border-radius:7px;background:none;cursor:pointer;color:var(--ink)}
.tbx button:hover{background:var(--on)}
.tbx button[data-tool][aria-pressed="true"]{background:var(--sel);color:#fff}
.tbx #t-pins[aria-pressed="true"],.tbx #t-grid[aria-pressed="true"],.tbx #t-ol[aria-pressed="true"]{background:var(--selbg);color:var(--sel)}
.tbx .hs{width:20px;height:1px;background:var(--line);margin:6px 0}

.bar{grid-column:1/-1;height:var(--bar);flex:none;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar .who{font-weight:600}
.bar .path{color:var(--lab)}
.bar .sp{flex:1}
.tools{display:flex;align-items:center;gap:2px}
.tools button{display:grid;place-items:center;min-width:32px;height:30px;padding:0 8px;border:0;border-radius:6px;background:none;cursor:pointer;color:var(--ink)}
.tools button:hover{background:var(--on)}
.tools button[aria-pressed="true"]{background:var(--sel);color:#fff}
.tools button:disabled{opacity:.35;cursor:default;background:none}
.tools #t-pins[aria-pressed="true"],.tools #t-grid[aria-pressed="true"]{background:var(--selbg);color:var(--sel)}
#bd[hidden]{display:none}
body:not(.tool-H):not(.tool-I) [data-tag], body:not(.tool-H):not(.tool-I) [data-tag] *{cursor:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2222%22%20height%3D%2226%22%20viewBox%3D%220%200%2022%2026%22%3E%3Cpath%20d%3D%22M2%202%20L2%2021%20L7.5%2016%20L11%2024%20L14%2022.6%20L10.6%2015%20L18%2015%20Z%22%20fill%3D%22%23C8142B%22%20stroke%3D%22%23fff%22%20stroke-width%3D%221.6%22%20stroke-linejoin%3D%22round%22/%3E%3C/svg%3E") 2 2, default}
#ctag{position:fixed;left:0;top:0;z-index:60;pointer-events:none;background:var(--red);color:#fff;font:600 13px/1.2 var(--f);letter-spacing:0;padding:4px 9px;border-radius:5px 12px 12px 12px;white-space:nowrap;will-change:transform}
#ctag[hidden]{display:none}
/* cetvel ve kılavuzlar */
.rul{position:fixed;z-index:22;background:var(--panel);pointer-events:auto}
.rul[hidden]{display:none}
#rh{height:20px;border-bottom:1px solid var(--line);cursor:row-resize}
#rv{width:20px;border-right:1px solid var(--line);cursor:col-resize}
#rc{width:20px;height:20px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.guide{position:absolute;z-index:7}
.guide.h{left:0;right:0;height:9px;margin-top:-4px;cursor:row-resize}
.guide.v{top:0;bottom:0;width:9px;margin-left:-4px;cursor:col-resize}
.guide::after{content:"";position:absolute;background:#F24822}
.guide.h::after{left:0;right:0;top:4px;height:1px}.guide.v::after{top:0;bottom:0;left:4px;width:1px}
#glab{position:fixed;left:0;top:0;z-index:62;pointer-events:none;font:600 11px/1 var(--f);letter-spacing:0;color:#fff;background:#F24822;padding:4px 6px;border-radius:4px;font-variant-numeric:tabular-nums}
#glab[hidden]{display:none}
/* yerçekimi: harfler ve bloklar ekranın dibine dökülür */
#grav{position:fixed;z-index:45;overflow:hidden;cursor:grab;touch-action:none}
#grav.dragging{cursor:grabbing}
#grav .gb{position:absolute;left:0;top:0;will-change:transform;transform-origin:50% 50%;user-select:none;-webkit-user-select:none;white-space:pre;pointer-events:none}
#grav img.gb{display:block;object-fit:cover}
.gv-h{visibility:hidden!important}
.gv-t{color:transparent!important;-webkit-text-stroke:0!important;text-decoration-color:transparent!important}
#gbtn{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:46;display:flex;align-items:center;gap:10px;background:#161616;color:#F2F2F0;border:0;border-radius:999px;padding:11px 18px;font:600 14px/1 var(--f);letter-spacing:0;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#gbtn kbd{font:500 11px/1 var(--f);color:#A9A9A6;border:1px solid #3A3A3A;border-radius:4px;padding:3px 5px}
#gbtn[hidden]{display:none}
@media (hover:none){#gbtn kbd{display:none}}
/* komut paleti */
#ck{position:fixed;inset:0;z-index:80;background:rgba(10,10,10,.28);display:flex;justify-content:center;align-items:flex-start;padding-top:16vh}
#ck[hidden]{display:none}
#ck .box{width:min(560px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 24px 60px rgba(0,0,0,.25);overflow:hidden}
#ck input{width:100%;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:500 16px/1 var(--f);letter-spacing:0;padding:16px 18px;outline:none}
#ck ul{list-style:none;margin:0;padding:6px;max-height:min(360px,52vh);overflow:auto}
#ck li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 12px;border-radius:7px;cursor:pointer;font:500 14px/1.2 var(--f);color:var(--ink)}
#ck li small{color:var(--mute);font-size:12px}
#ck li kbd{font:500 11px/1 var(--f);color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:3px 5px}
#ck li.on{background:var(--sel);color:#fff}#ck li.on small,#ck li.on kbd{color:rgba(255,255,255,.8);border-color:rgba(255,255,255,.35)}
#ck .none{padding:14px 12px;color:var(--mute);font-size:13px}
/* glifler */
.gp{display:grid;grid-template-columns:1fr auto;align-items:end;gap:6px 12px;padding:4px 0 10px}
.gp .big{grid-row:span 2;font-size:88px;line-height:1;height:96px;display:flex;align-items:center;justify-content:center;background:var(--on);border-radius:8px}
.gp b{font-size:13px}.gp span{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.gw{display:flex;gap:4px;margin:4px 0 10px;flex-wrap:wrap}
.gw button{border:1px solid var(--line);background:none;color:var(--ink);border-radius:6px;padding:5px 8px;font:500 12px/1 var(--f);cursor:pointer}
.gw button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(30px,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.gg button{aspect-ratio:1;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:none;color:var(--ink);font-size:17px;cursor:pointer;padding:0;display:grid;place-items:center}
.gg button:hover{background:var(--sel);color:#fff}
/* küçük sürprizler */
#toast{position:fixed;left:50%;bottom:28px;z-index:70;transform:translate(-50%,8px);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;display:flex;align-items:center;gap:10px;background:#161616;color:#F2F2F0;font:500 13px/1.35 var(--f);letter-spacing:0;padding:11px 16px;border-radius:9px;box-shadow:0 10px 30px rgba(0,0,0,.22);max-width:min(92vw,460px)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast i{width:8px;height:8px;border-radius:50%;background:#14AE5C;flex:none}
.cexp{margin-top:34px;border-top:1px solid #E6E6E3;padding-top:20px}
.cexp .lab2{font-size:12px;font-weight:600;color:#6B6B68;display:block;margin-bottom:12px}
.cexp .rows{display:flex;flex-wrap:wrap;gap:8px}
.cexp button{display:flex;align-items:center;gap:10px;border:1px solid #E1E1DE;background:#fff;color:#161616;border-radius:8px;padding:9px 12px;cursor:pointer;font:500 14px/1 var(--f)}
.cexp button:hover{border-color:#161616}
.cexp button small{color:#8E8E8A;font-size:12px}
.sw button{flex-wrap:wrap}.sw button em{font-style:normal;color:var(--mute);font-size:11px;flex-basis:100%;padding-left:34px;margin-top:-4px}
/* anahat görünümü (⌘Y): renk ve fotoğraf kalkar, iskelet ve tip ölçüleri kalır */
:root{--olk:#161616;--olc:rgba(13,153,255,.55)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--olk:#E8E8E6}}
:root[data-theme="dark"]{--olk:#E8E8E6}
body.ol #stage, body.ol #stage *{background:transparent!important;box-shadow:none!important;filter:none!important;text-shadow:none!important;color:transparent!important;-webkit-text-stroke:.5px var(--olk);border-color:var(--olk)!important;caret-color:transparent}
body.ol #stage [data-n]:not([data-k="char"]){outline:1px solid var(--olc);outline-offset:0}
body.ol #stage img{object-position:-99999px -99999px!important;outline:1px solid var(--olk)!important;outline-offset:-1px;
  background:linear-gradient(to top right,transparent calc(50% - .6px),var(--olk) 50%,transparent calc(50% + .6px)),linear-gradient(to bottom right,transparent calc(50% - .6px),var(--olk) 50%,transparent calc(50% + .6px))!important}
body.ol #stage svg *{fill:none!important;stroke:var(--olk)!important;stroke-width:1px!important;vector-effect:non-scaling-stroke}
body.ol #stage .gl{display:none!important}
#olh{position:fixed;left:0;top:0;z-index:59;pointer-events:none;font:500 10px/1 var(--f);letter-spacing:0;color:#fff;background:var(--sel);padding:3px 5px;border-radius:3px 3px 3px 0;white-space:nowrap;font-variant-numeric:tabular-nums;-webkit-text-stroke:0}
#olh[hidden]{display:none}
/* damlalık (I) */
body.tool-I .canvas, body.tool-I .canvas *{cursor:crosshair!important}
#loupe{position:fixed;left:0;top:0;z-index:61;pointer-events:none;will-change:transform;display:grid;justify-items:center;gap:6px}
#loupe[hidden]{display:none}
#loupe canvas{width:112px;height:112px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25),0 8px 22px rgba(0,0,0,.22);image-rendering:pixelated;background:#fff}
#loupe b{font:600 12px/1 var(--f);letter-spacing:0;color:#fff;background:#161616;padding:5px 8px;border-radius:5px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
#loupe b i{width:10px;height:10px;border-radius:2px;box-shadow:0 0 0 1px rgba(255,255,255,.5)}
.sw{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.sw button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px;cursor:pointer;font:500 12px/1 var(--f);font-variant-numeric:tabular-nums;text-align:left}
.sw button:hover{border-color:var(--ink)}
.sw button i{width:26px;height:26px;border-radius:4px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.tools #t-ol[aria-pressed="true"]{background:var(--selbg);color:var(--sel)}
.tools .vs{width:1px;height:18px;background:var(--line);margin:0 6px}
.tools button[hidden]{display:none}
.canvas:focus,.canvas:focus-visible{outline:none}
.f input::-webkit-inner-spin-button,.f input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.f input[type=number]{-moz-appearance:textfield;appearance:textfield}
.tools #t-reset{font-size:12.5px;font-weight:600}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{background:none;border:0;padding:5px 10px;cursor:pointer;color:var(--mute);font-weight:600;font-size:12.5px}
.seg button[aria-pressed="true"]{background:var(--on);color:var(--ink)}
.left,.right{background:var(--panel);overflow:auto;min-height:0}
.left{border-left:1px solid var(--line)}
.right{border-right:1px solid var(--line)}
.h{font-size:12px;font-weight:600;padding:16px 16px 8px}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:6px;height:30px;padding:0 16px;background:none;border:0;text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden;font-size:13px;flex:none}
.row:hover{background:var(--on)}
.row.on{background:var(--on);font-weight:600}
.row.sel{background:var(--selbg)}
.row .car{width:12px;flex:none;color:var(--lab);font-size:9px;text-align:center}
.row .ic{width:14px;flex:none;color:var(--lab);font-size:12px;text-align:center;display:grid;place-items:center}
.row.sel .ic{color:var(--sel)}
.row .t{overflow:hidden;text-overflow:ellipsis}
.row.off .t,.row.off .ic{opacity:.4}
.row .hid{margin-left:auto;font-size:11px;color:var(--lab)}
.sep{height:1px;background:var(--line);margin-top:10px}
.canvas{position:relative;overflow:auto;min-width:0;min-height:0;outline:none}
body.tool-H .canvas{cursor:grab}
body.panning,body.panning *{cursor:grabbing!important}
body.dragging,body.dragging *{cursor:default!important}
.stage{padding:64px 56px 120px;display:flex;flex-direction:column;gap:84px;align-items:center;min-height:100%;user-select:none;-webkit-user-select:none}
.stage img{-webkit-user-drag:none}
.counter{position:sticky;top:0;align-self:flex-end;margin:-40px -24px 0 0;color:var(--lab);font-variant-numeric:tabular-nums;font-size:13px}
.work{width:100%;max-width:1180px;display:flex;flex-direction:column;gap:18px}
.frames{position:relative;width:100%}
.fr{position:absolute}
.fr img{display:block;width:100%;height:100%;object-fit:cover;background:var(--paper)}
.fr.box img{box-shadow:0 1px 2px rgba(0,0,0,.06),0 10px 30px -12px rgba(0,0,0,.18)}
.fr.cut img{object-fit:contain;background:none;filter:drop-shadow(0 10px 18px rgba(0,0,0,.16))}
.fr .lab{position:absolute;left:0;top:-21px;font-size:12px;color:var(--lab);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.fr.isSel .lab{color:var(--sel)}
.fr.isSel{z-index:5}
p,.cap,.lead,.small,.rule,.kv span,.cm,.empty,.v{text-wrap:pretty}
.cap{font-size:16px;line-height:1.5;max-width:70ch;color:var(--mute);margin-top:34px}
.cap b{color:var(--ink);font-weight:600}
.wt{margin:0 0 -6px;font-size:17px;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
.card{background:var(--paper);color:#161616;box-shadow:0 1px 2px rgba(0,0,0,.06),0 10px 30px -12px rgba(0,0,0,.16);position:relative}
.card .lab{position:absolute;left:0;top:-21px;font-size:12px;color:var(--lab)}
.pcover{width:min(100%,1180px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:48px;padding:44px}
.pcover .nm{display:flex;align-items:center;gap:18px}
.pcover .logo{display:block;flex:none}
.pcover .nm > div{flex:1;min-width:0}
.pcover .nm > div{min-width:0}
.pcover h2{white-space:nowrap;font-size:var(--fit,clamp(20px,2.1cqi,30px));letter-spacing:-.03em;line-height:1;margin:0;text-wrap:nowrap}
.pcover .kind{color:#6B6B68;margin-top:6px}
.pcover .rule{font-size:var(--fit,clamp(22px,2.4cqi,30px));font-weight:500;letter-spacing:-.025em;line-height:1.15;margin:28px 0 0;text-wrap:balance}
.pcover p{font-size:15.5px;line-height:1.6;margin:0;max-width:62ch}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);color:#161616;border-radius:6px;padding:6px 10px 5px;font-size:13px;font-weight:500}
.kv{display:grid;grid-template-columns:72px 1fr;font-size:14px;line-height:1.45;border-top:1px solid #E2E1DD;padding:9px 0}
.kv span:first-child{color:#6B6B68}
.small{font-size:13px;color:#6B6B68;line-height:1.55}
.stack{display:flex;flex-direction:column;gap:16px}
.cover{flex:1;display:grid;place-items:center;width:100%;min-height:60vh}
.ttl{position:relative;font-weight:700;font-size:var(--fit,clamp(64px,11cqi,150px));letter-spacing:-.05em;line-height:1;padding:4px 18px 10px}
.cur{position:absolute;pointer-events:none}
.cur svg{display:block}
.cur b{letter-spacing:0;line-height:1.2;position:absolute;left:18px;top:22px;background:var(--red);color:#fff;font-size:13px;font-weight:600;padding:4px 9px;border-radius:5px 12px 12px 12px;white-space:nowrap}
.about{width:min(100%,1180px);padding:44px;display:flex;flex-direction:column;gap:36px}
.about .nm{position:relative;display:inline-block;align-self:flex-start;max-width:100%;font-weight:700;font-size:var(--fit,clamp(36px,5cqi,56px));letter-spacing:-.04em;line-height:1;padding:4px 8px;margin-left:-8px}
.about .role{align-self:flex-start}
.ahead{display:flex;align-items:flex-start;gap:36px}
.ahead .ph{width:220px;height:220px;flex:none}
.ahead .ph img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.aname{display:flex;flex-direction:column;gap:14px;min-width:0;flex:1}
.about .lead{font-size:16px;line-height:1.6;max-width:68ch;margin:0}
.about .lead b{font-weight:600}
.city b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.city span{font-size:13px;color:#6B6B68}

ages", ["Turkish, native", "English, limited working proficiency", "Russian, elementary"]]]}}};

// tek ölçekli raf yerleşimi: basılı parçalar gerçek ölçüleriyle, diğerleri piksel oranıyla
function pack(sizes, W, H, gap){
  const shelf = sc => { const rows=[]; let r=[], cw=0;
    sizes.forEach((s,i)=>{ const w=s[0]*sc; if(r.length && cw+gap+w>W){rows.push(r); r=[]; cw=0;} r.push(i); cw+=(r.length>1?gap:0)+w; });
    rows.push(r); const tot = rows.reduce((a,r)=>a+Math.max(...r.map(i=>sizes[i][1]*sc)),0)+(rows.length-1)*(gap+26);
    return {rows, tot, ok: sizes.every(s=>s[0]*sc<=W)}; };
  let lo=1e-4, hi=100; for(let k=0;k<50;k++){ const m=(lo+hi)/2, r=shelf(m); if(r.ok && r.tot<=H) lo=m; else hi=m; }
  const {rows} = shelf(lo), out=[]; let y=26;
  rows.forEach(r=>{ const rh=Math.max(...r.map(i=>sizes[i][1]*lo)), rw=r.reduce((a,i)=>a+sizes[i][0]*lo,0)+gap*(r.length-1); let x=(W-rw)/2;
    r.forEach(i=>{ out[i]={x,y,w:sizes[i][0]*lo,h:sizes[i][1]*lo}; x+=sizes[i][0]*lo+gap; }); y+=rh+gap+26; });
  return {boxes:out, height:y-gap};
}

function norm(e){ const o={}; for(const k in e){ const v=e[k]; if(v==null||v==='') continue; if((k==='x'||k==='y'||k==='r')&&!v) continue; if(k==='o'&&v===100) continue; if(k==='s'&&v===1) continue; if(k==='h'&&!v) continue; o[k]=v; } return o; }

  if(el.classList.contains('ch')) s.display = (e.x||e.y||e.r) ? 'inline-block' : '';
  s.translate = (e.x||e.y) ? (e.x||0)+'px '+(e.y||0)+'px' : '';
  s.rotate = e.r ? e.r+'deg' : '';
  s.scale = (e.s && e.s!==1) ? String(e.s) : '';

/* ---------- klavye ---------- */
addEventListener('keydown', e=>{
  if(!$('#grav').hidden){ if(e.key==='Escape'||e.key==='Enter'){ e.preventDefault(); gravUp(); } if(e.key===' ') e.preventDefault(); return; }
  if(!$('#ck').hidden){ ckKey(e); return; }
  if((e.metaKey||e.ctrlKey) && (e.key==='k'||e.key==='K'||e.key==='/')){ e.preventDefault(); ckOpen(); return; }
  if(!$('#lb').hidden){ if(/^[1-4]$/.test(e.key)){ ysSet(+e.key-1); return; } if(e.key==='Escape') closeLB(); else if(e.key==='ArrowRight') stepLB(1); else if(e.key==='ArrowLeft') stepLB(-1); return; }
  if(e.target.closest && e.target.closest('input, textarea, select')) return;
  const m = e.metaKey || e.ctrlKey, k = e.key;
  if(home) return;
  if(m && (k==='='||k==='+')){ e.preventDefault(); zoomBy(1.25); return; }
  if(m && (k==='-'||k==='_')){ e.preventDefault(); zoomBy(0.8); return; }
  if(e.ctrlKey && k.toLowerCase()==='g'){ e.preventDefault(); toggleGrid(); return; }
  if(k==='Alt'){ alt = true; e.preventDefault(); return; }
  if(m && k.toLowerCase()==='s'){ e.preventDefault(); toast(UI[lang][HIST.length ? 'saveB' : 'saveA']); return; }
  if(m && k.toLowerCase()==='z'){ e.preventDefault(); if(!e.shiftKey && !HIST.length){ toast(UI[lang].noUndo); return; } e.shiftKey ? redo() : undo(); return; }
  if(m && k.toLowerCase()==='y'){ e.preventDefault(); toggleOl(); return; }
  if(sel && e.altKey && !m && (k==='ArrowLeft'||k==='ArrowRight') && isText(sel)){ e.preventDefault(); const b = Object.assign({}, edits()[sel.dataset.id]||{}), cs = getComputedStyle(sel);
    const cur0 = b.ls!=null ? b.ls : Math.round((parseFloat(cs.letterSpacing)||0)/parseFloat(cs.fontSize)*1000);
    setEd(sel, {ls: Math.max(-300, Math.min(1000, cur0 + (k==='ArrowRight'?1:-1)*(e.shiftKey?50:10)))}); commit(sel, b); inspector(); syncPos(); return; }
  if(m || e.altKey) return;
  if(e.shiftKey && (k===')'||k==='=' || e.code==='Digit0' || e.code==='Digit1')){ e.preventDefault(); setZoom(1); return; }
  if(k==='C' && e.shiftKey){ togglePins(); return; }
  if((k==='R'||k==='r') && e.shiftKey && !m){ toggleRul(); return; }
  if(k==='c'||k==='C'||k==='i'||k==='I'){ tool = 'I'; bar(); return; }
  if(k===' ' && !e.target.closest('button')){ e.preventDefault(); if(!space){ space = true; SPT = performance.now(); SPM = false; hov = null; bar(); } return; }
  if(k==='v'||k==='V'){ tool = 'V'; bar(); return; }
  if(k==='h'||k==='H'){ tool = 'H'; hov = null; bar(); return; }
  if(k==='Escape' && tool==='I'){ tool = 'V'; bar(); return; }
  if(!sel) return;
  if(k==='Escape'){ select(null); return; }
  if(k==='Enter'){ e.preventDefault();
    if(e.shiftKey){ const p = parentOf(sel); if(p) select(p); }
    else { const c = sel.querySelector('[data-n]'); if(c) select(c); else if(sel.classList.contains('fr')) openLB(sel.dataset.wf); }
    return; }
  const dz = {'+':1,'=':1,'-':-1,'_':-1}[k];
  if(dz && isText(sel)){ e.preventDefault(); const b = Object.assign({}, edits()[sel.dataset.id]||{}), fs = parseFloat(getComputedStyle(sel).fontSize);
    setEd(sel, {fs: Math.max(6, Math.min(600, Math.round(fs) + dz*(e.shiftKey?10:1)))}); commit(sel, b); inspector(); }
  else if(dz && isImg(sel)){ e.preventDefault(); const b = Object.assign({}, edits()[sel.dataset.id]||{});
    setEd(sel, {s: Math.round(Math.max(0.2, Math.min(4, (b.s||1) + dz*(e.shiftKey?0.25:0.05)))*100)/100}); commit(sel, b); inspector(); }
});
let SPT = 0, SPM = false;
addEventListener('keyup', e=>{ if(e.key!==' ') return;
  if(!$('#grav').hidden){ if(!(e.target.closest && e.target.closest('input, textarea, button'))) gravUp(); return; }
  if(space){ space = false; bar(); if(!SPM && performance.now()-SPT < 260 && typeof canGrav==='function' && canGrav()) gravity(); } });

function allF(){ const s=sections().find(s=>s.id===cur); const r=[]; if(s&&s.proj) s.proj.works.forEach((w,wi)=>w.frames.forEach((f,fi)=>r.push(wi+'-'+fi))); return r; }

  $('#lb-img').src=d.f.src; $('#lb-img').alt=d.f.name; $('#lb-t').textContent=d.f.name; $('#lb').hidden=false; $('#lb-x').focus(); ysOpen(); }
function stepLB(n){ const a=allF(), i=a.indexOf(lbW); if(i<0) return; openLB(a[(i+n+a.length)%a.length]); }
function closeLB(){ ysPlayStop(); $('#lb').hidden=true; const el=document.querySelector('.fr[data-wf="'+lbW+'"]'); if(el) el.focus({preventScroll:true}); }

const YC = [0,1,2].map(i=>$('#lb-c'+i)); let ysV = 3, ysRaf = 0, ysOk = false;

  $('#ys-s').innerHTML = u.ysS.map((s,i)=>'<button type="button" data-ys="'+i+'" aria-pressed="'+(Math.abs(ysV-i)<.01)+'">'+s+'</button>').join(''); }
function ysApply(){ YC.forEach((c,i)=>{ c.style.opacity = ysOk ? Math.max(0, Math.min(1, (i+1)-ysV)) : 0; }); $('#ys-r').value = ysV;
  document.querySelectorAll('#ys-s [data-ys]').forEach(b=>b.setAttribute('aria-pressed', Math.abs(ysV-b.dataset.ys)<.01)); }
function ysSet(v){ ysPlayStop(); ysV = v; ysApply(); }
function ysPlace(){ const im = $('#lb-img'), r = im.getBoundingClientRect(), p = im.parentElement.getBoundingClientRect();
  YC.forEach(c=>{ c.style.left = (r.left-p.left)+'px'; c.style.top = (r.top-p.top)+'px'; c.style.width = r.width+'px'; c.style.height = r.height+'px'; }); }
function ysBuild(){ const im = $('#lb-img'); ysOk = false;
  try{ const sc = Math.min(1, 1600/Math.max(im.naturalWidth, im.naturalHeight)), w = Math.round(im.naturalWidth*sc), h = Math.round(im.naturalHeight*sc);
    const t = document.createElement('canvas'); t.width = w; t.height = h; const x = t.getContext('2d', {willReadFrequently:true}); x.drawImage(im, 0, 0, w, h);
    const src = x.getImageData(0, 0, w, h).data, L = new Float32Array(w*h);
    for(let i=0, j=0; i<L.length; i++, j+=4){ const a = src[j+3]/255; L[i] = (0.2126*src[j]+0.7152*src[j+1]+0.0722*src[j+2])*a + 247*(1-a); }
    const out = [0,1,2].map(()=>new ImageData(w, h)), T = [[28,28,28],[142,142,138],[242,242,240]];
    for(let y=0; y<h; y++) for(let xx=0; xx<w; xx++){ const i = y*w+xx, o = i*4, l = L[i];
      let m = 0; if(xx>0 && y>0 && xx<w-1 && y<h-1){ const a = L[i-w-1], b = L[i-w], c = L[i-w+1], d = L[i-1], f = L[i+1], g = L[i+w-1], hh = L[i+w], k = L[i+w+1];
        const gx = (c+2*f+k)-(a+2*d+g), gy = (g+2*hh+k)-(a+2*b+c); m = Math.sqrt(gx*gx+gy*gy); }
      const e = 250 - Math.min(1, m/160)*228; out[0].data.set([e, e, e-2, 255], o);
      const q = T[l<80 ? 0 : l<172 ? 1 : 2]; out[1].data.set([q[0], q[1], q[2], 255], o);
      out[2].data.set([l, l, l, 255], o); }
    YC.forEach((c,i)=>{ c.width = w; c.height = h; c.getContext('2d').putImageData(out[i], 0, 0); }); ysOk = true; }catch(err){ ysOk = false; }
  $('#ys').hidden = !ysOk; ysPlace(); ysApply(); }
function ysOpen(){ ysPlayStop(); ysV = 3; ysUI(); ysApply(); $('#ys').hidden = true; const im = $('#lb-img');
  if(im.complete && im.naturalWidth) requestAnimationFrame(ysBuild); else im.onload = ()=>ysBuild(); }
function ysPlayStop(){ if(ysRaf){ cancelAnimationFrame(ysRaf); ysRaf = 0; } const b = $('#ys-play'); if(b) b.textContent = UI[lang].ysPlay; }
function ysPlay(){ if(ysRaf){ ysPlayStop(); return; } const t0 = performance.now(), D = 4200; $('#ys-play').textContent = UI[lang].ysStop;

    L.push(['font-family','"Instrument Sans"'],['font-weight',cs.fontWeight],['font-size',r1(fs)+'px'],
      ['line-height', isNaN(lh) ? 'normal' : r1(lh)+'px /* '+Math.round(lh/fs*100)+'% */'],
      ['letter-spacing', r1(ls)+'px /* '+r1(ls/fs*100)+'% */'],['color',hex(cs.color).toUpperCase()]);
    if(cs.textAlign!=='start' && cs.textAlign!=='left') L.push(['text-align',cs.textAlign]); }
  else if(el.classList.contains('fr')){ const d = getF(el.dataset.wf), m = (d.f.px.match(/\d+/g)||[]).map(Number);
    let ar = ''; if(m.length===2){ const g = gcd(m[0],m[1]), a = m[0]/g, b = m[1]/g; ar = (a<=32 && b<=32) ? a+' / '+b : (Math.round(m[0]/m[1]*100)/100)+' / 1'; }
    L.push(['width',p.w+'px'],['height',p.h+'px']); if(ar) L.push(['aspect-ratio',ar]);
    L.push(['object-fit', d.f.cut ? 'contain' : 'cover']); if(d.f.mm) L.push(['/* baskı */', d.f.mm[0]+' × '+d.f.mm[1]+' mm']);
    L.push(['/* kaynak */', d.f.px+' px, '+(d.f.src.endsWith('.png')?'PNG':'JPG')]); }
  else { L.push(['width',p.w+'px'],['height',p.h+'px'],['display',cs.display]);
    if(cs.display==='grid') L.push(['grid-template-columns',cs.gridTemplateColumns]);
    if(cs.gap && cs.gap!=='normal') L.push(['gap',cs.gap]);
    if(cs.padding && cs.padding!=='0px') L.push(['padding',cs.padding]);
    if(cs.backgroundColor && !/rgba\(.*,\s*0\)$/.test(cs.backgroundColor) && cs.backgroundColor!=='transparent') L.push(['background',hex(cs.backgroundColor).toUpperCase()]);
    if(cs.borderRadius && cs.borderRadius!=='0px') L.push(['border-radius',cs.borderRadius]); }
  return '<div class="grp"><div class="k">CSS</div><pre class="code">'+L.map(([a,b])=>a.startsWith('/*') ? '<span class="p">'+esc(a)+' '+esc(b)+'</span>' : '<span class="p">'+esc(a)+':</span> '+esc(b)+';').join('\n')+'</pre><div class="acts"><button class="btn" type="button" data-act="copycss">'+UI[lang].copyCss+'</button></div></div>';
}

/* ---------- PDF ---------- */
async function download(path, name){
  let d = null;
  try{ d = (window.claude && window.claude.use) ? await window.claude.use('downloads') : null; }catch(e){ d = null; }
  if(d){ try{ const blob = await (await fetch(path)).blob(); await d.save({filename:name, data:blob}); return; }catch(err){ if(err && (err.code==='declined' || err.code==='rate_limited')) return; } }
  const a = document.createElement('a'); a.href = path; a.download = name; a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove();
}
